name: Unified CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-asyncio mongomock
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Linting with Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check backend/ --select=E9,F63,F7,F82 --target-version=py311
        # Exit-zero treats all errors as warnings.
        ruff check backend/ --exit-zero --target-version=py311

    - name: Backend Unit Tests
      env:
        MONGO_URI: mongodb://localhost:27017/test_db
        REDIS_URL: redis://localhost:6379
        SECRET_KEY: ci-test-secret
        ADMIN_USERNAME: admin
        ADMIN_PASSWORD: password
      run: |
        pytest backend/tests/unit

    - name: Analytical Integration Tests
      env:
        MONGO_URI: mongodb://localhost:27017/test_db
        REDIS_URL: redis://localhost:6379
        ANALYTICS_RESOURCES_DIR: backend/resources/analytics
        ANALYTICS_OUTPUT_DIR: /tmp/analytics_out
      run: |
        pytest backend/tests/integration/test_analytics.py

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub (Example)
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push production image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./backend/Dockerfile
        push: true
        tags: |
          questioner/backend:latest
          questioner/backend:${{ github.sha }}
        cache-from: type=registry,ref=questioner/backend:buildcache
        cache-to: type=registry,ref=questioner/backend:buildcache,mode=max
