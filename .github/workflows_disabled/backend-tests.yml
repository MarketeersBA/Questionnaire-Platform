name: Backend Quality Assurance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set Environment Variables
      run: |
        echo "MONGO_URI=mongodb://localhost:27017/test_db" >> $GITHUB_ENV
        echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
        echo "OPENAI_API_KEY=mock_key" >> $GITHUB_ENV

    - name: Set capture-auth test secrets
      run: |
        echo "SECRET_KEY=ci-capture-auth-test-secret" >> $GITHUB_ENV
        echo "ADMIN_USERNAME=admin" >> $GITHUB_ENV
        echo "ADMIN_PASSWORD=admin123" >> $GITHUB_ENV

    - name: Run capture auth tests (PPTX Phases 1–7)
      run: |
        pytest backend/tests/capture_auth \
          backend/tests/test_capture_auth.py \
          backend/tests/test_capture_session.py \
          backend/tests/test_capture_preflight_auth.py \
          backend/tests/test_report_capture_auth.py \
          -o addopts= -q

    - name: Run voice feedback tests with coverage
      run: |
        pytest backend/tests/voice_feedback/ \
          --cov=backend/voice_feedback \
          --cov-report=term-missing \
          --cov-fail-under=90
