events {
    worker_connections 1024;
}

http {
    # Use Docker embedded DNS so nginx resolves service names at runtime
    resolver 127.0.0.11 valid=30s;
    include mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Proxy /api/ requests to the backend (strip the /api prefix)
        location /api/ {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Remove proxy buffer constraints for large analytics responses or file uploads
            proxy_buffering off;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
        }

        # Proxy all other requests to the Vite frontend dev server
        location / {
            # Resolve `frontend` at request time and use a variable so DNS is re-evaluated
            set $upstream_frontend "frontend:5173";
            proxy_pass http://$upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Vite HMR (Hot Module Replacement)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts and retry upstreams on transient failures to reduce 502s
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}
