events {
    worker_connections 1024;
}

http {
    # Use Docker embedded DNS so nginx resolves service names at runtime
    resolver 127.0.0.11 valid=30s;
    include mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    # HTTP server - redirects all traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name questionnaire.marketeers-ba.com;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name questionnaire.marketeers-ba.com;

        # SSL Certificates (Managed by Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/questionnaire.marketeers-ba.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/questionnaire.marketeers-ba.com/privkey.pem;

        # Recommended SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Proxy /api/ requests to the backend (strip the /api prefix)
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            set $upstream_backend "backend:8080";
            proxy_pass http://$upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Remove proxy buffer constraints for large analytics responses or file uploads
            proxy_buffering off;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
        }

        # Proxy all other requests to the Vite frontend dev server
        location / {
            # Resolve `frontend` at request time and use a variable so DNS is re-evaluated
            set $upstream_frontend "frontend:5173";
            proxy_pass http://$upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Vite HMR (Hot Module Replacement)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts and retry upstreams on transient failures to reduce 502s
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}
