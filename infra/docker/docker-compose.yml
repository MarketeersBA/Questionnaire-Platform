services:
  mongodb:
    image: mongo:latest
    container_name: questioner_mongodb
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - questioner_network

  redis:
    image: redis:alpine
    container_name: questioner_redis
    ports:
      - "6370:6379"
    networks:
      - questioner_network

  backend:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.dev
    container_name: questioner_backend
    ports:
      - "8081:8080"
    env_file:
      - ../../.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/survey_platform
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://localhost,http://localhost}
      - ENV=${ENV:-dev}
      - REPORTS_DIR=backend/presintion report
      - ANALYTICS_DEVELOPER_MODE=true
      - PPTX_RENDER_MODE=hybrid
      - PPTX_ROLLOUT_STAGE=comparison
      - PPTX_EXPORT_FRONTEND_BASE_URL=${FRONTEND_URL:-http://frontend:5173}
    depends_on:
      - mongodb
      - redis
    networks:
      - questioner_network
    volumes:
      - ../../backend:/app/backend
      - reports_data:/app/reports

  pptx-worker:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.dev
    container_name: questioner_pptx_worker
    command: python -m backend.workers.pptx_worker
    env_file:
      - ../../.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/survey_platform
      - REDIS_URL=redis://redis:6379/0
      - ENV=dev
      - REPORTS_DIR=backend/presintion report
      - PPTX_RENDER_MODE=hybrid
      - PPTX_ROLLOUT_STAGE=comparison
      - PPTX_EXPORT_FRONTEND_BASE_URL=http://frontend:5173
      # Preflight report API probe: hit backend directly inside Docker network (recommended).
      - PPTX_CAPTURE_API_BASE_URL=http://backend:8080
      - PPTX_QUEUE_ENABLED=true
      - PPTX_STALE_RECOVERY_ENABLED=true
      - PPTX_CAPTURE_PROGRESS_ENABLED=true
    depends_on:
      - mongodb
      - redis
      - backend
      - frontend
    networks:
      - questioner_network
    volumes:
      - ../../backend:/app/backend
      - reports_data:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: ../../
      dockerfile: frontend/Dockerfile.dev
    container_name: questioner_frontend
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - ENV=${ENV:-dev}
      - VITE_PUBLIC_SURVEY_BASE_URL=${FRONTEND_URL:-https://localhost}
    depends_on:
      - backend
    networks:
      - questioner_network

  nginx:
    image: nginx:alpine
    container_name: questioner_nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../../infra/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ../../certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - questioner_network

networks:
  questioner_network:
    driver: bridge

volumes:
  mongodb_data:
  reports_data:
