# Pinned so the project identity does not depend on the directory this file is
# run from. Without it Compose derives the project name from the parent folder —
# "docker" here — while the containers below carry fixed `container_name` values
# prefixed "questioner_". Run the stack once from a differently named path (or
# with -p) and Compose creates a second project that fights the first over those
# same fixed names: `down` then finds containers it recognises by name but which
# carry another project's label, and fails instantly with an ownership error
# rather than stopping them.
name: questioner

services:
  redis:
    image: redis:alpine
    container_name: questioner_redis
    ports:
      - "6370:6379"
    networks:
      - questioner_network



  backend:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.dev
    container_name: questioner_backend
    ports:
      - "8081:8080"
    env_file:
      - ../../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=https://questionnaire.marketeers-ba.com
      - ENV=${ENV:-dev}
      - REPORTS_DIR=backend/presintion report
      - ANALYTICS_DEVELOPER_MODE=true
      - PPTX_RENDER_MODE=hybrid
      - PPTX_ROLLOUT_STAGE=comparison
      - PPTX_EXPORT_FRONTEND_BASE_URL=https://questionnaire.marketeers-ba.com
      # Server-to-server address for headless rendering (PDF export and
      # PPTX chart capture). Distinct from the public URL above: without it
      # the browser inside this container is sent to the live site with a
      # locally-signed token, which is refused, so every export waits out
      # its timeout instead of rendering.
      - REPORT_RENDER_BASE_URL=http://frontend:5173
    depends_on:
      - redis
    networks:
      - questioner_network
    # Public resolvers: Docker's embedded DNS forwards to the host resolver,
    # which on some networks (VPNs, captive portals) cannot answer the SRV
    # lookup that a mongodb+srv:// URI requires. A failed lookup used to kill
    # startup outright.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Without this a single transient failure left the container exited and the
    # whole app unreachable until someone restarted it by hand.
    restart: unless-stopped
    volumes:
      - ../../backend:/app/backend
      - reports_data:/app/reports

  pptx-worker:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.dev
    container_name: questioner_pptx_worker
    command: python -m backend.workers.pptx_worker
    env_file:
      - ../../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENV=dev
      - REPORTS_DIR=backend/presintion report
      - PPTX_RENDER_MODE=hybrid
      - PPTX_ROLLOUT_STAGE=comparison
      - PPTX_EXPORT_FRONTEND_BASE_URL=https://questionnaire.marketeers-ba.com
      # Server-to-server address for headless rendering (PDF export and
      # PPTX chart capture). Distinct from the public URL above: without it
      # the browser inside this container is sent to the live site with a
      # locally-signed token, which is refused, so every export waits out
      # its timeout instead of rendering.
      - REPORT_RENDER_BASE_URL=http://frontend:5173
      # Preflight report API probe: hit backend directly inside Docker network (recommended).
      - PPTX_CAPTURE_API_BASE_URL=http://backend:8080
      - PPTX_QUEUE_ENABLED=true
      - PPTX_STALE_RECOVERY_ENABLED=true
      - PPTX_CAPTURE_PROGRESS_ENABLED=true
    depends_on:
      - redis
      - backend
      - frontend
    networks:
      - questioner_network
    volumes:
      - ../../backend:/app/backend
      - reports_data:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: ../../
      dockerfile: frontend/Dockerfile.dev
    container_name: questioner_frontend
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - ENV=${ENV:-dev}

    depends_on:
      - backend
    networks:
      - questioner_network

  nginx:
    image: nginx:alpine
    container_name: questioner_nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../../infra/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../../certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - questioner_network

networks:
  questioner_network:
    driver: bridge

volumes:
  reports_data:
